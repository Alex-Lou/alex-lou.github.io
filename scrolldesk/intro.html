<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Demo | Ilya Alexeev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="styleintro.css">
</head>
<body class="m-0 p-0 overflow-hidden w-full h-screen bg-black font-sans">

  <div class="absolute inset-0 flex flex-col items-center justify-center z-10 text-center px-6">
    <p id="head1" class="intro-text text-2xl sm:text-3xl lg:text-4xl font-extralight text-white mb-2">Welcome</p>
    <p id="head2" class="intro-text text-2xl sm:text-3xl lg:text-4xl font-extralight text-white mb-2">My name is Ilya Alexeev</p>
    <p id="head3" class="intro-text text-2xl sm:text-3xl lg:text-4xl font-extralight text-white mb-2">Let me show you what I build</p>
    <p id="head4" class="intro-text text-2xl sm:text-3xl lg:text-4xl font-extralight text-white mb-8">Enjoy the experience</p>
    <a href="index.html"
       class="inline-flex items-center px-8 py-3 text-white text-lg font-semibold bg-white/10 border border-white/20 rounded-xl backdrop-blur-sm transition-all duration-300 hover:bg-white/20 hover:border-white/50 hover:shadow-lg hover:-translate-y-0.5 z-10 enter-btn">
      Enter
    </a>
  </div>

  <div class="particle x1"></div>
  <div class="particle x2"></div>
  <div class="particle x3"></div>
  <div class="particle x4"></div>
  <div class="particle x5"></div>
  <div class="particle x6"></div>
  <div class="particle x7"></div>
  <div class="particle x8"></div>
  <div class="particle x9"></div>

  <div class="fixed left-5 bottom-5 z-10 flex gap-2">
    <a target="_blank" href="https://github.com/Alex-Lou"
       class="text-xs px-3 py-1.5 bg-white/10 text-gray-300 no-underline rounded transition-colors hover:bg-white hover:text-black">GitHub</a>
    <a target="_blank" href="https://linkedin.com"
       class="text-xs px-3 py-1.5 bg-white/10 text-gray-300 no-underline rounded transition-colors hover:bg-white hover:text-black">LinkedIn</a>
  </div>
</body>
</html>
